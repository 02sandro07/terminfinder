<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wann fahren wir nach Hamburg?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
:root{
  --bg:#F2F5F6;
  --card:#FFFFFF;
  --ink:#1C272C;
  --muted:#586A72;
  --line:#D9E2E6;
  --accent:#1F5D73;
  --accent-ink:#FFFFFF;
  --free-bg:#DEEEF2;
  --free-ink:#1B5265;
  --free-line:#B7D8E1;
  --busy-bg:#F6DCD7;
  --busy-ink:#8C3B32;
  --busy-line:#E6BBB3;
  --gold:#B77F2A;
  --gold-bg:#F5E9D4;
  --wa:#1FAF57;
  --wa-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(28,39,44,.06),0 4px 14px rgba(28,39,44,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A1E;
    --card:#1B2529;
    --ink:#E5EDF0;
    --muted:#94A7AF;
    --line:#2B383E;
    --accent:#63AFC9;
    --accent-ink:#0D1B21;
    --free-bg:#1C3540;
    --free-ink:#9FD3E4;
    --free-line:#2C5261;
    --busy-bg:#43261F;
    --busy-ink:#EBA89C;
    --busy-line:#5F352C;
    --gold:#E0B061;
    --gold-bg:#3A2F1B;
    --wa:#2BC46A;
    --wa-ink:#0E1F14;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#121A1E;
  --card:#1B2529;
  --ink:#E5EDF0;
  --muted:#94A7AF;
  --line:#2B383E;
  --accent:#63AFC9;
  --accent-ink:#0D1B21;
  --free-bg:#1C3540;
  --free-ink:#9FD3E4;
  --free-line:#2C5261;
  --busy-bg:#43261F;
  --busy-ink:#EBA89C;
  --busy-line:#5F352C;
  --gold:#E0B061;
  --gold-bg:#3A2F1B;
  --wa:#2BC46A;
  --wa-ink:#0E1F14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
}
#app{max-width:560px;margin:0 auto;padding:20px 16px 56px}
.eyebrow{
  font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:0 0 4px;
}
h1{
  font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  font-weight:700;font-size:2rem;line-height:1.1;margin:0 0 6px;text-wrap:balance;
}
.sub{color:var(--muted);margin:0 0 22px;font-size:.95rem}
h2{
  font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  font-weight:600;font-size:1.15rem;margin:28px 0 10px;
}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px;box-shadow:var(--shadow);
}
.notice{
  background:var(--gold-bg);color:var(--ink);border:1px solid var(--gold);
  border-radius:10px;padding:10px 12px;margin:0 0 16px;font-size:.92rem;
}
.live{
  display:inline-flex;align-items:center;gap:6px;color:var(--muted);
  font-size:.82rem;margin:0 0 4px;
}
.live .dot-live{
  width:8px;height:8px;border-radius:50%;background:var(--wa);display:inline-block;
}
.people{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.chip{
  display:inline-flex;align-items:center;gap:6px;
  background:var(--card);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;font-size:.95rem;font-weight:500;color:var(--ink);
  cursor:pointer;font-family:inherit;
}
.chip.me{border-color:var(--accent)}
.chip small{color:var(--muted);font-weight:400}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;border-radius:12px;padding:13px 20px;font-size:1rem;font-weight:600;
  font-family:inherit;cursor:pointer;text-decoration:none;
}
.btn:focus-visible,.chip:focus-visible,.day:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--accent-ink);width:100%}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--busy-ink);border:1px solid var(--busy-line)}
.btn-row{display:flex;gap:10px;margin-top:14px}
.btn-row .btn{flex:1}
.btn[disabled]{opacity:.55;cursor:default}
label{display:block;font-weight:600;font-size:.9rem;margin:0 0 6px}
input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);
  color:var(--ink);font:inherit;padding:11px 12px;
}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.field-error{color:var(--busy-ink);font-size:.88rem;margin:6px 0 0}
.hint{color:var(--muted);font-size:.92rem;margin:4px 0 12px}
.legend{display:flex;gap:14px;margin:0 0 10px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block}
.dot-free{background:var(--free-bg);border:1px solid var(--free-line)}
.dot-busy{background:var(--busy-bg);border:1px solid var(--busy-line)}
.month{margin:18px 0 0}
.month-head{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  margin:0 0 8px;
}
.month-head b{
  font-family:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  font-weight:600;font-size:1rem;
}
.month-head .mini{
  display:flex;gap:6px;
}
.mini button{
  border:1px solid var(--line);background:transparent;color:var(--muted);
  border-radius:8px;padding:4px 10px;font-size:.78rem;font-weight:500;
  cursor:pointer;font-family:inherit;
}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{
  text-align:center;font-size:.75rem;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.04em;padding:2px 0;
}
.day{
  aspect-ratio:1/1;border-radius:10px;border:1px solid var(--free-line);
  background:var(--free-bg);color:var(--free-ink);
  font:inherit;font-weight:600;font-size:1rem;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-variant-numeric:tabular-nums;
}
.day.busy{
  background:var(--busy-bg);border-color:var(--busy-line);color:var(--busy-ink);
  text-decoration:line-through;font-weight:400;
}
.day.blank{visibility:hidden}
.quick{display:flex;gap:8px;margin:12px 0 0}
.quick .btn{flex:1;padding:9px 8px;font-size:.85rem;font-weight:500}
.slot{
  display:flex;align-items:center;gap:12px;justify-content:space-between;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin:0 0 8px;box-shadow:var(--shadow);
}
.slot.perfect{border-color:var(--free-line);background:var(--free-bg)}
.slot-date{font-weight:600}
.slot.perfect .slot-date{color:var(--free-ink)}
.slot-sub{font-size:.85rem;color:var(--muted);margin-top:1px}
.slot.perfect .slot-sub{color:var(--free-ink);opacity:.85}
.pill{
  flex-shrink:0;border-radius:999px;padding:4px 11px;font-size:.85rem;font-weight:600;
  font-variant-numeric:tabular-nums;background:var(--bg);color:var(--muted);
  border:1px solid var(--line);
}
.slot.perfect .pill{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tag{
  display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--gold);margin-left:8px;
}
details{margin-top:6px}
summary{cursor:pointer;color:var(--muted);font-size:.92rem;padding:6px 2px}
.settings{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:30px;padding-top:16px;border-top:1px solid var(--line);
  color:var(--muted);font-size:.92rem;
}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--ink);font-size:1.1rem;font-weight:600;
  cursor:pointer;font-family:inherit;
}
.stepper b{min-width:120px;text-align:center;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:.95rem}
.sharefoot{margin-top:14px}
@media (prefers-reduced-motion: no-preference){
  .day,.chip,.btn{transition:background .12s,border-color .12s,color .12s}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ===== Konfiguration ===== */
var DB_URL="https://terminfinder-5b9bf-default-rtdb.europe-west1.firebasedatabase.app";
var PLAN="plan-hamburg";
var TITLE="Wann fahren wir nach Hamburg?";
var RANGE_LABEL="15. Okt. 2026 – 30. Juni 2027";
var START={y:2026,m:9,d:15};       /* 15. Oktober 2026 */
var END={y:2027,m:5,d:30};         /* 30. Juni 2027 */
var LS_ME="tf-me-hamburg";

var WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
var MON=["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sep.","Okt.","Nov.","Dez."];
var MONL=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

/* Tag = Offset 0..N-1 ab Startdatum */
function dateOf(off){ return new Date(START.y,START.m,START.d+off); }
var N=Math.round((new Date(END.y,END.m,END.d)-new Date(START.y,START.m,START.d))/86400000)+1;

function wd(off){ return WD[dateOf(off).getDay()]; }
function isWeekend(off){ var g=dateOf(off).getDay(); return g===0||g===6; }
function fmt(off){ var dt=dateOf(off); return WD[dt.getDay()]+" "+dt.getDate()+". "+MON[dt.getMonth()]; }

/* Monatsliste für den Kalender: {y,m,fromOff,toOff} */
var MONTHS=(function(){
  var out=[],off=0;
  while(off<N){
    var dt=dateOf(off);
    var y=dt.getFullYear(),m=dt.getMonth();
    var from=off;
    while(off<N){ var t=dateOf(off); if(t.getMonth()!==m||t.getFullYear()!==y) break; off++; }
    out.push({y:y,m:m,fromOff:from,toOff:off-1});
  }
  return out;
})();

var state={nights:2,people:[]};
var ui={view:"loading",editingName:null,draftName:"",busy:new Set(),
        nameError:"",notice:"",saving:false,confirmDelete:false,live:false};
var myName=null;
try{ myName=localStorage.getItem(LS_ME); }catch(e){}

/* ===== Kompakte Codierung der Offsets ("0-4,12") ===== */
function decodeDays(str){
  var out=[];
  if(!str||typeof str!=="string") return out;
  str.split(",").forEach(function(part){
    var m=part.split("-");
    var a=parseInt(m[0],10), b=m.length>1?parseInt(m[1],10):a;
    if(isNaN(a)||isNaN(b)) return;
    for(var d=Math.max(0,a); d<=Math.min(N-1,b); d++) out.push(d);
  });
  return out;
}
function encodeDays(arr){
  var a=arr.slice().sort(function(x,y){return x-y;});
  var parts=[],i=0;
  while(i<a.length){
    var j=i;
    while(j+1<a.length && a[j+1]===a[j]+1) j++;
    parts.push(j>i ? a[i]+"-"+a[j] : String(a[i]));
    i=j+1;
  }
  return parts.join(",");
}

/* ===== Datenbank (Firebase Realtime Database, REST) ===== */
function keyFor(name){ return encodeURIComponent(name).replace(/\./g,"%2E"); }
function dbGet(path){
  return fetch(DB_URL+"/"+PLAN+path+".json",{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("GET "+r.status);
    return r.json();
  });
}
function dbPut(path,val){
  return fetch(DB_URL+"/"+PLAN+path+".json",{
    method:"PUT",headers:{"Content-Type":"application/json"},
    body:JSON.stringify(val)
  }).then(function(r){ if(!r.ok) throw new Error("PUT "+r.status); return r.json(); });
}
function dbDelete(path){
  return fetch(DB_URL+"/"+PLAN+path+".json",{method:"DELETE"}).then(function(r){
    if(!r.ok) throw new Error("DELETE "+r.status);
  });
}
function applyRaw(raw){
  var st={nights:2,people:[]};
  if(raw&&typeof raw==="object"){
    var n=parseInt(raw.nights,10);
    if(!isNaN(n)&&n>=1&&n<=7) st.nights=n;
    if(raw.people&&typeof raw.people==="object"){
      Object.keys(raw.people).forEach(function(k){
        var p=raw.people[k];
        if(!p||typeof p.name!=="string") return;
        var name=p.name.trim().slice(0,40);
        if(!name) return;
        if(st.people.some(function(q){return q.name===name;})) return;
        st.people.push({key:k,name:name,busy:decodeDays(p.busy)});
      });
    }
  }
  st.people.sort(function(a,b){return a.name.localeCompare(b.name,"de");});
  state=st;
}
function refresh(){
  return dbGet("").then(function(raw){
    applyRaw(raw);
    if(ui.view==="list"||ui.view==="loading"||ui.view==="error"){ ui.view="list"; render(); }
  });
}

/* ===== Live-Updates ===== */
var pollTimer=null, es=null, refreshQueued=false;
function queueRefresh(){
  if(refreshQueued) return;
  refreshQueued=true;
  setTimeout(function(){ refreshQueued=false; refresh().catch(function(){}); },400);
}
function startLive(){
  try{
    es=new EventSource(DB_URL+"/"+PLAN+".json");
    es.addEventListener("put",function(){ ui.live=true; queueRefresh(); });
    es.addEventListener("patch",function(){ ui.live=true; queueRefresh(); });
    es.onerror=function(){
      ui.live=false;
      if(es){ es.close(); es=null; }
      startPolling();
      setTimeout(startLive,15000);
    };
  }catch(e){ startPolling(); }
}
function startPolling(){
  if(pollTimer) return;
  pollTimer=setInterval(function(){
    if(ui.view==="list") refresh().catch(function(){});
  },5000);
}

/* ===== Termin-Berechnung ===== */
function computeSlots(){
  var len=state.nights+1, out=[];
  for(var s=0;s+len-1<N;s++){
    var days=[]; for(var i=0;i<len;i++) days.push(s+i);
    var cant=state.people.filter(function(p){
      return days.some(function(d){return p.busy.indexOf(d)>=0;});
    }).map(function(p){return p.name;});
    out.push({s:s,e:s+len-1,cant:cant,can:state.people.length-cant.length,
      fullWeekend:days.some(function(d){return dateOf(d).getDay()===6;}) &&
                  days.some(function(d){return dateOf(d).getDay()===0;}),
      wkd:days.filter(isWeekend).length});
  }
  return out;
}

/* ===== DOM-Helfer ===== */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs) for(var k in attrs){
    if(k==="text") el.textContent=attrs[k];
    else if(k==="onclick") el.addEventListener("click",attrs[k]);
    else if(k==="oninput") el.addEventListener("input",attrs[k]);
    else el.setAttribute(k,attrs[k]);
  }
  for(var i=2;i<arguments.length;i++){
    var c=arguments[i];
    if(c!=null) el.appendChild(typeof c==="string"?document.createTextNode(c):c);
  }
  return el;
}

/* ===== Ansichten ===== */
function render(){
  var app=document.getElementById("app");
  app.textContent="";
  app.appendChild(h("p",{class:"eyebrow",text:RANGE_LABEL+" · "+state.nights+" Nächte · "+(state.nights+1)+" Tage"}));
  app.appendChild(h("h1",{text:TITLE}));

  if(ui.view==="loading"){
    app.appendChild(h("p",{class:"sub",text:"Einen Moment, die Einträge werden geladen …"}));
    return;
  }
  if(ui.view==="error"){
    app.appendChild(h("div",{class:"notice",text:"Die Einträge konnten nicht geladen werden. Prüfe kurz deine Internetverbindung."}));
    app.appendChild(h("button",{class:"btn btn-primary",text:"Nochmal versuchen",onclick:function(){
      ui.view="loading"; render();
      refresh().catch(function(){ ui.view="error"; render(); });
    }}));
    return;
  }

  app.appendChild(h("p",{class:"sub",text:"Trag dich kurz ein – alle sehen sofort, welche Termine passen. Es gibt nur diesen einen Link."}));
  if(ui.notice) app.appendChild(h("div",{class:"notice",text:ui.notice}));
  if(ui.view==="edit"){ renderEdit(app); return; }
  renderList(app);
}

function renderList(app){
  if(ui.live){
    app.appendChild(h("p",{class:"live"},h("span",{class:"dot-live"}),"live – Änderungen erscheinen sofort"));
  }
  app.appendChild(h("h2",{text:"Wer hat sich schon eingetragen?"}));
  if(state.people.length){
    var row=h("div",{class:"people"});
    state.people.forEach(function(p){
      var free=N-p.busy.length;
      var isMe=p.name===myName;
      row.appendChild(h("button",{class:"chip"+(isMe?" me":""),onclick:function(){openEdit(p.name);}},
        p.name+(isMe?" (du)":"")+" ",h("small",{text:free+" Tage frei ✎"})));
    });
    app.appendChild(row);
    app.appendChild(h("p",{class:"hint",text:"Zum Ändern auf deinen Namen tippen."}));
  }else{
    app.appendChild(h("p",{class:"empty",text:"Noch niemand. Mach du den Anfang!"}));
  }
  app.appendChild(h("button",{class:"btn btn-primary",onclick:function(){openEdit(null);},text:"+ Ich trag mich ein"}));

  renderResults(app);

  var minus=h("button",{text:"−",onclick:function(){changeNights(-1);},"aria-label":"Eine Nacht weniger"});
  var plus=h("button",{text:"+",onclick:function(){changeNights(1);},"aria-label":"Eine Nacht mehr"});
  app.appendChild(h("div",{class:"settings"},
    h("span",{text:"Wie lange fahren wir?"}),
    h("div",{class:"stepper"},minus,
      h("b",{text:state.nights+" Nächte · "+(state.nights+1)+" Tage"}),plus)));

  var msg="🚢 "+TITLE+" Trag deine Tage hier ein:\n"+location.href.split("#")[0];
  app.appendChild(h("div",{class:"sharefoot"},
    h("a",{class:"btn btn-ghost",style:"width:100%",
      href:"https://wa.me/?text="+encodeURIComponent(msg),
      target:"_blank",rel:"noopener",text:"Link per WhatsApp teilen"})));
}

function renderResults(app){
  app.appendChild(h("h2",{text:"Mögliche Termine"}));
  var P=state.people.length;
  if(!P){
    app.appendChild(h("p",{class:"empty",text:"Sobald sich die Ersten eingetragen haben, erscheinen hier die Termine, die passen."}));
    return;
  }
  var slots=computeSlots();
  var perfect=slots.filter(function(s){return s.can===P;});
  var rest=slots.filter(function(s){return s.can<P;}).sort(function(a,b){
    return b.can-a.can || b.wkd-a.wkd || a.s-b.s;
  });

  function slotCard(sl,isPerfect){
    var left=h("div",null,
      h("div",{class:"slot-date"},
        fmt(sl.s)+" – "+fmt(sl.e),
        sl.fullWeekend?h("span",{class:"tag",text:"Wochenende"}):null),
      h("div",{class:"slot-sub",text:isPerfect?
        (P===1?"Passt bisher":"Da können alle "+P):
        "Nicht dabei: "+sl.cant.join(", ")}));
    return h("div",{class:"slot"+(isPerfect?" perfect":"")},left,
      h("span",{class:"pill",text:sl.can+"/"+P}));
  }

  if(perfect.length){
    /* Bei so einem langen Zeitraum: Wochenend-Termine zuerst zeigen */
    var sorted=perfect.slice().sort(function(a,b){
      return (b.fullWeekend?1:0)-(a.fullWeekend?1:0) || a.s-b.s;
    });
    sorted.slice(0,6).forEach(function(sl){app.appendChild(slotCard(sl,true));});
    if(sorted.length>6){
      var det=h("details",null,h("summary",{text:(sorted.length-6)+" weitere Termine, die für alle passen"}));
      sorted.slice(6,56).forEach(function(sl){det.appendChild(slotCard(sl,true));});
      if(sorted.length>56) det.appendChild(h("p",{class:"hint",text:"… und noch mehr. Je mehr Leute sich eintragen, desto kürzer wird die Liste."}));
      app.appendChild(det);
    }
  }else{
    app.appendChild(h("p",{class:"hint",text:"Kein Termin passt für alle – das sind die besten Optionen:"}));
    rest.slice(0,5).forEach(function(sl){app.appendChild(slotCard(sl,false));});
    rest=rest.slice(5);
  }
  if(perfect.length&&rest.length){
    var det2=h("details",null,h("summary",{text:"Termine anzeigen, die nicht für alle passen"}));
    rest.filter(function(s){return s.can>0;}).slice(0,15).forEach(function(sl){det2.appendChild(slotCard(sl,false));});
    app.appendChild(det2);
  }
}

function openEdit(name){
  ui.view="edit"; ui.editingName=name; ui.nameError=""; ui.notice=""; ui.confirmDelete=false;
  if(name){
    var p=state.people.filter(function(x){return x.name===name;})[0];
    ui.draftName=name; ui.busy=new Set(p?p.busy:[]);
  }else{
    ui.draftName=(myName&&!state.people.some(function(p){return p.name===myName;}))?myName:"";
    ui.busy=new Set();
  }
  render();
  window.scrollTo(0,0);
}

function renderEdit(app){
  var card=h("div",{class:"card"});
  card.appendChild(h("label",{for:"tf-name",text:"Dein Name"}));
  var input=h("input",{type:"text",id:"tf-name",value:ui.draftName,placeholder:"z. B. Anna",
    autocomplete:"off",oninput:function(e){ui.draftName=e.target.value;ui.nameError="";}});
  card.appendChild(input);
  if(ui.nameError) card.appendChild(h("p",{class:"field-error",text:ui.nameError}));

  card.appendChild(h("p",{class:"hint",style:"margin-top:14px",
    text:"Tippe die Tage an, an denen du KEINE Zeit hast – sie werden rot durchgestrichen. Mit den Knöpfen neben jedem Monat kannst du ganze Monate auf einmal setzen."}));
  card.appendChild(h("div",{class:"legend"},
    h("span",null,h("span",{class:"dot dot-free"}),"kann ich"),
    h("span",null,h("span",{class:"dot dot-busy"}),"kann ich nicht")));

  MONTHS.forEach(function(mo){
    var wrap=h("div",{class:"month"});
    var head=h("div",{class:"month-head"},
      h("b",{text:MONL[mo.m]+" "+mo.y}),
      h("div",{class:"mini"},
        h("button",{text:"alles grün",onclick:function(){
          for(var o=mo.fromOff;o<=mo.toOff;o++) ui.busy.delete(o);
          render();
        }}),
        h("button",{text:"alles rot",onclick:function(){
          for(var o=mo.fromOff;o<=mo.toOff;o++) ui.busy.add(o);
          render();
        }})));
    wrap.appendChild(head);

    var cal=h("div",{class:"cal",role:"group","aria-label":"Kalender "+MONL[mo.m]+" "+mo.y});
    ["Mo","Di","Mi","Do","Fr","Sa","So"].forEach(function(w){
      cal.appendChild(h("div",{class:"cal-h",text:w}));
    });
    var firstDow=(dateOf(mo.fromOff).getDay()+6)%7;
    for(var b=0;b<firstDow;b++) cal.appendChild(h("div",{class:"day blank"}));
    for(var o=mo.fromOff;o<=mo.toOff;o++){
      (function(o){
        var busy=ui.busy.has(o);
        var dt=dateOf(o);
        cal.appendChild(h("button",{
          class:"day"+(busy?" busy":""),
          "aria-pressed":busy?"true":"false",
          "aria-label":dt.getDate()+". "+MONL[dt.getMonth()]+", "+(busy?"keine Zeit":"Zeit"),
          onclick:function(){ if(ui.busy.has(o))ui.busy.delete(o);else ui.busy.add(o); render(); }
        },String(dt.getDate())));
      })(o);
    }
    wrap.appendChild(cal);
    card.appendChild(wrap);
  });

  card.appendChild(h("div",{class:"quick"},
    h("button",{class:"btn btn-ghost",text:"Alles auf grün",onclick:function(){ui.busy=new Set();render();}}),
    h("button",{class:"btn btn-ghost",text:"Alles auf rot",onclick:function(){
      ui.busy=new Set(); for(var i=0;i<N;i++)ui.busy.add(i); render();}})));

  var saveBtn=h("button",{class:"btn btn-primary",text:ui.saving?"Wird gespeichert …":"Speichern",onclick:onSave});
  if(ui.saving) saveBtn.disabled=true;
  var cancel=h("button",{class:"btn btn-ghost",text:"Abbrechen",onclick:function(){
    ui.view="list"; render(); window.scrollTo(0,0);}});
  if(ui.saving) cancel.disabled=true;
  card.appendChild(h("div",{class:"btn-row"},cancel,saveBtn));

  if(ui.editingName){
    var del=h("button",{class:"btn btn-danger",style:"width:100%;margin-top:10px",
      text:ui.confirmDelete?"Wirklich löschen?":"Meinen Eintrag löschen",
      onclick:function(){
        if(!ui.confirmDelete){ui.confirmDelete=true;render();return;}
        var name=ui.editingName;
        ui.saving=true; render();
        dbDelete("/people/"+keyFor(name)).then(function(){
          return refresh();
        }).then(function(){
          ui.saving=false; ui.view="list";
          ui.notice="Eintrag gelöscht.";
          render(); window.scrollTo(0,0);
        }).catch(function(){
          ui.saving=false;
          ui.nameError="Löschen hat nicht geklappt – bitte nochmal versuchen.";
          render();
        });
      }});
    if(ui.saving) del.disabled=true;
    card.appendChild(del);
  }
  app.appendChild(card);
}

function onSave(){
  var name=ui.draftName.trim().slice(0,40);
  if(!name){ ui.nameError="Bitte gib zuerst deinen Namen ein."; render(); window.scrollTo(0,0); return; }
  var taken=state.people.some(function(p){return p.name===name && p.name!==ui.editingName;});
  if(taken){
    ui.nameError="Diesen Namen gibt es schon. Wenn du das bist: geh zurück und tippe auf deinen Namen. Sonst nimm z. B. „"+name+" B.“";
    render(); window.scrollTo(0,0); return;
  }
  var busy=Array.from(ui.busy).sort(function(a,b){return a-b;});
  ui.saving=true; render();

  var work=Promise.resolve();
  if(ui.editingName && ui.editingName!==name){
    work=dbDelete("/people/"+keyFor(ui.editingName)).catch(function(){});
  }
  work.then(function(){
    return dbPut("/people/"+keyFor(name),{name:name,busy:encodeDays(busy)});
  }).then(function(){
    myName=name;
    try{ localStorage.setItem(LS_ME,name); }catch(e){}
    return refresh();
  }).then(function(){
    ui.saving=false; ui.view="list";
    ui.notice="Gespeichert! Alle anderen sehen deine Auswahl automatisch – du musst nichts weiterleiten.";
    render(); window.scrollTo(0,0);
    setTimeout(function(){ if(ui.notice){ ui.notice=""; if(ui.view==="list") render(); } },6000);
  }).catch(function(){
    ui.saving=false;
    ui.nameError="Speichern hat nicht geklappt – prüfe deine Internetverbindung und tippe nochmal auf „Speichern“.";
    render();
  });
}

function changeNights(delta){
  var n=state.nights+delta;
  if(n<1||n>7) return;
  dbPut("/nights",n).then(function(){ return refresh(); }).catch(function(){
    ui.notice="Ändern hat nicht geklappt – bitte nochmal versuchen."; render();
  });
}

/* ===== Start ===== */
render();
refresh().then(function(){
  startLive();
  startPolling();
}).catch(function(){
  ui.view="error"; render();
});
})();
</script>
</body>
</html>
